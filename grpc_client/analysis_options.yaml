analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - macos/**
    - lib/generated/**
include: package:flutter_lints/flutter.yaml
linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - require_trailing_commas
    - type_annotate_public_apis
    - unnecessary_lambdas
    - use_colored_box
    - use_decorated_box
